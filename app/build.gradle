plugins {
    id 'com.android.application'
}

android {
    namespace 'com.birdie.brillbody'
    compileSdk 35

    defaultConfig {
        applicationId 'com.birdie.brillbody'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Deliberately empty: this MVP uses only Android platform APIs.
}
